<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Studio</title>
<script src="/ui/settings.js"></script>   <!-- the app's settings (cv.paperDark and the rest), the same as the board's; first, before anything reads them -->
<script src="/ui/menu.js"></script>       <!-- the app's one chevron (HY_CHEV) -->
<script src="/ui/icons.js"></script>      <!-- the editors' one icon family (owner 2026-10-06): the tools look the same here and in the 3D studio -->
<script src="/ui/split.js"></script>      <!-- the app's one splitter between panel sections, also the 3D studio's layer list -->
<script src="/ui/eyedrag.js"></script>    <!-- Photoshop's eye drag: the eyes and locks of Layers and the Raw Editor's section eyes (owner 2026-10-07) -->
<script src="/ui/typing.js"></script><script src="/ui/keyhints.js"></script>   <!-- no key while typing (2026-10-10); a tool's key as a <kbd> under ⌘ (2026-10-05) -->
<script src="/ui/slider.js"></script>     <!-- the app's one slider, the 3D editor's look (owner 2026-10-06: sliders must be the same everywhere) -->
<link rel="stylesheet" href="/ui/tokens.css"><link rel="stylesheet" href="/ui/hy/hy.css">   <!-- the app's tokens (the palette, heights, corners) and primitives -->
<link rel="stylesheet" href="/ui/look.css"><link rel="stylesheet" href="/ui/slider.css">   <!-- the app's plates: their shadow (--plate-sh by data-shadow and the theme), corners by data-shape, menus, key caps -->
<script type="module" src="/ui/hy/index.js"></script>   <!-- the primitives: an iframe has its own registry, so the studio loads them itself -->
<script>
// the app's look before the first paint, as the board has it (owner 2026-10-06: «why does it not follow our design rules, shadows,
// roundings and all our standardized styles»): data-theme, data-shape («Форма»), data-shadow («Тени») and the paper colours come from
// the board around this page (it opens in place over the board); a page on its own reads the same settings (cv.*). lookSync() below
// keeps following the board while the page lives
(() => {
  const de = document.documentElement; let src = null;
  try { if (parent !== window && parent.document.documentElement.dataset.shape) src = parent.document.documentElement; } catch (e) {}
  if (src) {
    ['theme', 'shape', 'shadow'].forEach(k => { if (src.dataset[k]) de.dataset[k] = src.dataset[k]; });
    ['--paper-d', '--paper-l', '--inset'].forEach(k => { const v = src.style.getPropertyValue(k); if (v) de.style.setProperty(k, v); });
    return;
  }
  const ls = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
  const t = ls('cv.theme', 'auto');
  de.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
  de.dataset.shape = ls('cv.shape', 'round'); de.dataset.shadow = ls('cv.shadow', '0');
})();
</script>
<style>
/* The app's design system, the board's own (owner 2026-10-06: «why is this thing full width and why does it not follow our design
   rules, shadows, roundings and all our standardized styles»). The palette is the board's for both themes (canvas.html :root); a plate
   is the board's crumb, its round buttons and the bar over the selection: the panel colour at 82 % over a 14 px blur, a hairline of
   --line, the shadow of ui/look.css (--plate-sh: deep on the dark paper, soft on the light one, none with «Тени: без теней»); menus,
   settings and dialogs are its popovers (92 %). The corners follow «Форма» (data-shape) with look.css's numbers: round pills, or «pro»
   11 px for a 38 px plate, 14 px for a bar, 8 px for a control inside a plate; panels keep 14 px either way. The root takes the board's
   data-theme, data-shape and data-shadow (the script above, lookSync below), so the editor changes with the board's settings. */
:root{
  --rul:0px;--inset:0px;
  --raise2:#e4e4e7;--red:#ff453a;   /* the palette and --sans are ui/tokens.css; the studio's own colours here */
  --track:#d4d4d8;--hover:color-mix(in srgb,var(--ink) 6%,transparent);
  --ease:cubic-bezier(.3,.8,.25,1);
  --plate:color-mix(in srgb,var(--panel) 82%,transparent);
  --popbg:color-mix(in srgb,var(--panel) 92%,transparent);
  --r-plate:999px;--r-bar:999px;--r-ctl:var(--hy-row-r,999px);--r-in:999px;--r-box:12px;--r-row:9px;--r-panel:14px;
  --colw:316px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--raise2:#232327;--track:#34343a}}
:root[data-theme=dark]{--raise2:#232327;--track:#34343a}
/* --r-ctl is the app's one row radius (ui/look.css --hy-row-r, owner 2026-10-06: a slider and the field beside it never differ in shape) */
:root[data-shape=pro]{--r-plate:11px;--r-bar:14px;--r-ctl:var(--hy-row-r,8px);--r-in:6px;--r-box:8px;--r-row:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
  font:500 13px/1.3 var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
#view{position:fixed;inset:0;display:block;touch-action:none}
.plate{position:absolute;background:var(--plate);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--plate-sh)} #obar,#rail{box-shadow:var(--hy-sh-row)}   /* the tools' rail (the dock) and the hint plate under the row: flat with «Тени: только панели» (Hyimg ui/tokens.css) */
.kc,kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin:0;
  font:600 11px/1 var(--sans);color:var(--sub);background:var(--raise);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;flex:none}
.muted{color:var(--muted)}
.ib{position:relative;flex:none;width:30px;height:30px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--sub);
  transition:background .2s var(--ease),color .2s var(--ease),opacity .25s var(--ease),transform .2s var(--ease)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:active{transform:scale(.92)}
.ib.on{background:var(--raise2);color:var(--ink)}
.ib.dis{opacity:.35;pointer-events:none}
.ib.sq{width:28px;height:28px}
/* ui/look.css squares Home's big .btn to 11 px in «pro»; here a .btn is a row's button and keeps the row radius of its neighbours */
:root[data-shape=pro] :is(#side,#obar,#dlg,body) .btn{border-radius:var(--r-ctl)!important}

/* ---- rail: a 38 px plate down the left; an open library floats over the window's left part, the rail steps out from under it ---- */
body{--rul:18px}   /* the rulers' room is kept whether they show or not (owner 2026-10-06: «rulers must not affect anything by appearing or disappearing»): the dock, the rail, the popovers and the canvas never move with them */
#rail{left:calc(12px + max(var(--rul),var(--inset)));transition:left .3s var(--ease),top .3s var(--ease);top:calc((var(--topy) + 100vh - 58px) / 2);transform:translateY(-50%);width:38px;border-radius:var(--r-plate);padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px}
#rail .hl{position:absolute;left:3px;top:3px;width:30px;height:30px;border-radius:var(--r-ctl);background:var(--raise2);transition:transform .34s var(--ease);pointer-events:none}
#rail .ib.on{background:transparent}
#rail .ib.grp:after{content:"";position:absolute;right:4px;bottom:4px;border-left:4px solid transparent;border-bottom:4px solid var(--muted)}
#rail .ib.grp.on:after{border-bottom-color:var(--ink)}
#rail .ib.grp:after{top:auto;left:auto;opacity:1;background:none;border-radius:0}   /* ui/keyhints.js draws a ground over a button with a key cap: not over the group's triangle */
#rail .ib>kbd{min-width:15px;height:15px;padding:0 3px;font-size:9.5px;border-bottom-width:1px;border-radius:4px;right:-4px;top:auto;bottom:-4px;translate:none}   /* the key on the button's corner, only under ⌘ */
.vsep{flex:none;height:1px;width:18px;background:var(--line);margin:4px 0}
#cols{position:relative;width:30px;height:36px;margin:2px 0}
#cols .sw{position:absolute;width:17px;height:17px;border-radius:4px;box-shadow:0 0 0 1.5px var(--panel),0 0 0 2.5px var(--muted);transition:background .3s var(--ease),transform .2s var(--ease),left .3s var(--ease),top .3s var(--ease)}
#cols .sw:hover{transform:scale(1.08)}
#cols .fg{left:3px;top:3px;z-index:2}
#cols .bg{left:11px;top:13px;z-index:1}
#cols .swap{position:absolute;right:-1px;top:-2px;width:12px;height:12px;color:var(--muted);display:grid;place-items:center;transition:color .2s}
#cols .swap:hover,#cols .rst:hover{color:var(--ink)}
#cols .rst{position:absolute;left:0;bottom:-3px;width:11px;height:11px;color:var(--muted)}
#cols .rst i{position:absolute;width:6px;height:6px;border:1px solid currentColor;border-radius:1.5px}
#cols .rst i:first-child{left:0;top:0;background:#000}
#cols .rst i:last-child{left:3px;top:3px;background:#fff}

.menu .mt{padding:6px 10px 4px;color:var(--muted);font:500 11px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.menu .onck{margin-left:10px;color:var(--sel);display:grid}

/* ---- menus ---- */
.menu{position:fixed;z-index:60;min-width:200px;padding:6px;border-radius:var(--r-panel);background:var(--popbg);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--plate-sh);
  opacity:0;transform:translateY(-4px) scale(.985);transform-origin:top left;pointer-events:none;transition:opacity .16s var(--ease),transform .24s var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 10px;border-radius:var(--r-row);font:500 12.5px var(--sans);color:var(--sub);text-align:left;transition:background .12s,color .12s}
.menu button:hover,.menu button.hot{background:var(--raise);color:var(--ink)}
.menu button>svg{opacity:.75}
.menu button.dis{opacity:.4;pointer-events:none}
.menu .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mh{color:var(--muted);margin-left:4px}
.menu .mi0{width:15px;flex:none}
.menu .mk{display:inline-flex;gap:3px;margin-left:18px;flex:none}
.menu .mk kbd{color:var(--ink)}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .chk{width:15px;flex:none;color:var(--sel)}
.hy-chev{display:block;width:12px;height:12px;flex:none;color:var(--muted);transition:transform .25s var(--ease)}

/* ---- right column ---- */
/* the right column is two blocks 8 px apart, round 12 «A · Line» (owner 2026-10-09, r12/image-effects.html and image-raw.html: «реализуй
   этот дизайн»): each .pg a block of the app (ui/hy/block.css .hy-blk, its header .hy-bh), the gap between them the divider (#split,
   .hy-split-gap); the column has no plate of its own. Its controls are dark wells, a value wears the Studio's purple (--frame) */
#side{position:absolute;right:12px;transition:opacity .25s var(--ease),transform .32s var(--ease);top:58px;bottom:12px;width:var(--colw);display:flex;flex-direction:column;padding:0;overflow:visible;
  border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;--r-ctl:var(--hy-ctl-r);--r-in:4px;--sel:var(--frame);--hy-sel:var(--frame);
  --hy-acc:var(--frame);--hy-val:color-mix(in srgb,var(--frame) 30%,transparent);--hy-val-drag:color-mix(in srgb,var(--frame) 44%,transparent);
  --hy-val-on:color-mix(in srgb,var(--frame) 30%,var(--hy-well));--hy-val-ink:color-mix(in srgb,var(--frame) 14%,var(--ink))}
#pbody{overflow-y:auto;flex:1;min-height:0;padding:0 6px 6px;scrollbar-width:none}
#pbody::-webkit-scrollbar{display:none}
/* a section: the app's (.hy-sec, .hy-sh); its chevron in the head's 16 px box */
.sh{width:100%;cursor:pointer;transition:color .18s var(--ease)}
.sh:hover{color:var(--ink)}
.sh .hy-chev{width:11px;height:11px;margin:0 2.5px;transform:rotate(90deg);transition:transform .25s var(--ease)}
.sec.shut .sh .hy-chev{transform:none}
.sb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s var(--ease)}
.sec.shut .sb{grid-template-rows:0fr}
.sb>div{min-height:0;overflow:hidden}
.sbi{padding:2px 10px 8px;display:flex;flex-direction:column;gap:var(--hy-gap-ctl)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--hy-gap-ctl)}
.nf{display:flex;align-items:center;height:28px;border-radius:var(--r-ctl);background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px;gap:6px;transition:box-shadow .2s var(--ease)}
.nf:focus-within{box-shadow:inset 0 0 0 1px var(--sel)}
.nf .nl{color:var(--muted);font-size:12px;flex:none}   /* a handle to scrub: ui/hy/scrub.css .hy-scrub-h */
.nf input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}
.nf .nu{color:var(--muted);font-size:12px}
.hy-slider{--hy-sl-h:28px;font-size:12.5px}   /* the app's one slider (ui/slider.css) at the panel's row height */
.row{display:flex;align-items:center;gap:6px}
.btn{height:28px;border-radius:var(--r-ctl);background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--ink);font-size:12.5px;white-space:nowrap;
  transition:background .18s var(--ease),transform .18s var(--ease),opacity .2s}
.btn:hover{background:var(--raise2)}
.btn:active{transform:scale(.97)}
.btn svg{color:var(--sub)}
.btn.on{background:var(--ink);color:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.on svg{color:var(--panel)}
.btn.f{flex:1}
.selb{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px;border-radius:var(--r-ctl);background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px 0 12px;color:var(--ink);font-size:12.5px;min-width:0;transition:background .18s}
.selb:hover{background:var(--raise2)}
.selb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selb .hy-chev{transform:rotate(90deg)}
.seg{position:relative;display:flex;height:28px;padding:2px;border-radius:var(--r-ctl);background:var(--raise)}
.seg .st{position:absolute;top:2px;height:24px;border-radius:var(--r-in);background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line);transition:left .3s var(--ease),width .3s var(--ease)}
.seg button{position:relative;flex:1;height:24px;border-radius:var(--r-in);color:var(--sub);display:grid;place-items:center;font-size:12px;padding:0 6px;transition:color .2s}
.seg button.on{color:var(--ink)}
.note{font:400 11px/1.35 var(--sans);letter-spacing:.01em;color:var(--hy-hint,var(--muted))}   /* a note is a footnote: the app's hint (ui/look.css .hy-hint, owner 2026-10-06) */
.note b{font-weight:500;color:var(--ink)}
.bgsw{width:28px;height:28px;border-radius:var(--r-ctl);box-shadow:inset 0 0 0 1px var(--line);position:relative;transition:transform .18s var(--ease)}
.bgsw.on:after{content:"";position:absolute;inset:-3px;border-radius:var(--r-ctl);box-shadow:0 0 0 1.5px var(--ink)}
.bgsw:hover{transform:scale(1.06)}
.bgsw.tr{background:conic-gradient(var(--raise2) 25%,var(--raise) 0 50%,var(--raise2) 0 75%,var(--raise) 0) 0 0/10px 10px}
.lockr{width:28px;height:28px;flex:none;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--sub);background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);transition:color .2s,background .2s}
.lockr.on{color:var(--panel);background:var(--ink)}
/* the right column's controls (r11.css «controls inside panels», r12/image-effects.html): wells 24 px with the column's 6 px corners
   (--r-ctl), no hairline; a button lies on the block a hair lighter; what is chosen or on wears the Studio's purple (--hy-val-on) */
#side :is(.nf,.selb,.mini){height:var(--hy-ctl-h);background:var(--hy-well);box-shadow:none;padding:0 8px;font-size:12px}
#side :is(.nf,.selb,.mini):hover{background:var(--hy-well-hov)}
#side .nf:focus-within{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sel) 65%,transparent)}
#side :is(.nf,.mini) input{font-size:12px}
#side .btn{height:var(--hy-ctl-h);background:var(--hy-wbtn);box-shadow:none;padding:0 9px;font-size:12px}
#side .btn:hover{background:var(--hy-wbtn-hov)}
#side .btn.on{background:var(--hy-val-on);color:var(--hy-val-ink);box-shadow:none}
#side .btn.on svg{color:var(--hy-val-ink)}
#side .whr{gap:var(--hy-gap-ctl)}
#side .whr .btn{width:var(--hy-ctl-h)}
#side .seg{border-radius:var(--hy-well-r);background:var(--hy-well)}
#side .seg .st{border-radius:var(--hy-well-in-r);background:var(--hy-val-on);box-shadow:none}
#side .seg button{border-radius:var(--hy-well-in-r)}
#side .seg button.on{color:var(--hy-val-ink)}
#side :is(.bgsw,.lockr){width:var(--hy-ctl-h);height:var(--hy-ctl-h)}
#side .lockr{background:var(--hy-wbtn);box-shadow:none}
#side .lockr.on,#side .xlk.on{background:var(--hy-val-on);color:var(--hy-val-ink);box-shadow:none}
#side .xlk{height:var(--hy-ctl-h);min-width:var(--hy-ctl-h)}

/* #split is the app's one splitter (ui/split.js .hy-split: the hairline, the grip, .off) */
.tab .ti{display:grid}
.tab .tl{max-width:140px;opacity:1;overflow:hidden;white-space:nowrap;transition:max-width .32s var(--ease),opacity .22s var(--ease)}
.tabs.tight .tab:not(.on) .tl{max-width:0;opacity:0}
.tabs{overflow:hidden}
.tab.hide{display:none}
#side.gone{opacity:0;transform:translateX(14px);pointer-events:none}
.pg{display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:none;box-shadow:var(--plate-sh);transition:height .38s var(--ease)}   /* a block (.hy-blk), its depth by «Тени» */
.pg.fill{flex:1 1 auto}
.pg.closed{display:none}
#side.drag .pg{transition:none}
#side.drag.snap .pg{transition:height .38s var(--ease)}   /* a fold while the line is dragged eases (owner 2026-10-04: nothing jumps) */
.tabs .sp{flex:1}
#split{height:var(--hy-gap-blk)}   /* the gap between the two blocks is the divider: the accent line under the pointer (ui/split.js .hy-split-gap) */
.tab .tc{font:400 11.5px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}   /* the tabs are the block header's (.hy-bh-tab) */
.pgb{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.pane{display:none;flex-direction:column;flex:1;min-height:0}
.pane.on{display:flex;animation:paneIn .28s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(4px)}}
#padj,#phist,#pchan{overflow-y:auto;scrollbar-width:none;padding:2px 6px 6px}
#padj{padding:4px 10px 8px} #padj>.cgbox{margin:-4px -10px 0}   /* the Raw Editor's panel takes the block's width, its own rows inset (colorgrade.js) */
.adjg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.adjt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:var(--r-box);background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);color:var(--sub);font-size:12px;
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease)}
.adjt:hover{background:var(--raise2);color:var(--ink)}
.adjt:active{transform:scale(.97)}
.adjt.dis{opacity:.35;pointer-events:none}
.adjt canvas{width:56px;height:34px;border-radius:6px;display:block;outline:1px solid var(--line);outline-offset:-1px}
.adjt.on{color:var(--ink);background:color-mix(in srgb,var(--sel) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sel) 55%,transparent)}   /* the chosen preset: the one selected look of the editor's rows */
.hrow{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:var(--r-row);color:var(--ink);font-size:12.5px;width:100%;text-align:left;transition:background .15s var(--ease),opacity .2s}
.hrow:hover{background:var(--raise)}
.hrow.cur{background:color-mix(in srgb,var(--sel) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sel) 55%,transparent)}
.hrow.fut{opacity:.42}
.hrow svg{color:var(--sub)}
.hrow .hn{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.chr{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px;border-radius:var(--r-row);color:var(--ink);font-size:12.5px;width:100%;transition:background .15s var(--ease)}
.chr:hover{background:var(--raise)}
.chr.cur{background:color-mix(in srgb,var(--sel) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sel) 55%,transparent)}
.chr canvas{width:30px;height:30px;border-radius:5px;background:#000;box-shadow:inset 0 0 0 1px var(--line)}
.chr .ck{margin-left:auto;display:flex;gap:3px}
.chr .muted{font-size:12px}

.lh{display:flex;align-items:center;gap:8px;padding:2px 12px 8px}
.lh b{font-weight:600}
.lset{padding:2px 10px 6px;display:flex;flex-direction:column;gap:var(--hy-gap-ctl)}
.lset .row{gap:var(--hy-gap-ctl)}
.lset .selb{flex:1}

   editor's own library panel stays out */
#wl,#tlibR,#libp{display:none!important}

#crumb.home0 #cHome,#crumb.home0 #cHome+.cs,#crumb.proj0 #cProj,#crumb.proj0 #cProj+.cs{display:none}

#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:66;height:38px;border-radius:var(--r-plate);display:flex;align-items:center;gap:10px;padding:0 16px;
  color:var(--sub);white-space:nowrap;pointer-events:none;transition:opacity .35s var(--ease),transform .45s var(--ease)}
#loading.off{opacity:0;transform:translate(-50%,-50%) scale(.96)}

@keyframes spin{to{transform:rotate(360deg)}}
#rcard.err .bar i{background:var(--red)}
/* In place on the board (owner 2026-10-05: «we stay on the same canvas, elements just get added»): the page is transparent, the board
   shows through; the tool rail comes in from the left, the panels from the right, the options bar and Cancel, Save under and at the top
   right. The board keeps its own crumb and dock (imgframe.js), so the editor's are out. Every move eases both ways */
:root.board,:root.board body{background:transparent!important}
:root.board :is(#crumb,#wl,#tlibR,#libp,#dock,#loading){display:none!important}
:root.board #rail{translate:calc(-100% - 60px) 0;opacity:0;transition:translate .46s var(--ease),opacity .32s var(--ease),left .3s var(--ease),top .3s var(--ease)}
:root.board #side{translate:calc(100% + 40px) 0;opacity:0;transition:translate .46s var(--ease),opacity .32s var(--ease),transform .32s var(--ease)}
:root.board #obar{translate:0 -10px;opacity:0;transition:translate .4s var(--ease),opacity .3s var(--ease),top .3s var(--ease),left .3s var(--ease),right .3s var(--ease)}
:root.board #topr{opacity:0;transition:opacity .3s var(--ease)}:root.board :is(#bset,#sets){display:none!important}   /* a Studio: no round buttons (owner 2026-10-09) */
:root.board body.in :is(#rail,#side,#obar){translate:0 0;opacity:1}
:root.board body.in #topr{opacity:1}
:root.board body.in #side.gone{opacity:0}
:root.board #view{transition:opacity .34s var(--ease)}
:root.board body.out #view{opacity:0}
:root.board body:not(.in) :is(#rail,#side,#obar,#topr,#bset){pointer-events:none}
:root{--frame:#8b5cf6}
/* inside the Studio every chosen, checked or primary thing wears the Studio's purple (owner 2026-10-09 on a blue «Anti-alias» box and a
   white Save: «вот здесь цвета неверные, вроде же бы в цвет режима должно быть?»); blue is the board's selection. :not(#_) outranks
   the theme's :root[data-theme] of ui/tokens.css */
:root:not(#_){--sel:var(--frame);--hy-sel:var(--frame)}
.tp{background:var(--frame);border-color:var(--frame);color:var(--hy-on-accent,#fff)}
:root[data-theme=light]{--frame:#7c3aed}   /* the board's light purple (imgframe.js), so the studio and its dock are one colour */
/* the studio's own on, chosen and primary controls too, white marks on the purple (owner 2026-10-09 on the white Discard of «Close without
   saving?»: «почему здесь кнопка до сих пор белая? Она должна быть такого цвета, в каком режиме мы сейчас находимся»): a dialog's action,
   OK and Go on the options strip, Generate, a pressed toggle or tab, the chosen anchor and pivot, the render's progress. Cancel and the
   other secondary buttons stay as they are */
:is(#dlg .ok,.oib.ok,.mbt.go,.gbtn,.btn.on,.lockr.on,.db.on,.oib.on,.mbt.on,#actsTabs button.on,#bActs[aria-pressed=true]):is(*,:hover){
  background:var(--sel);color:var(--hy-on-accent,#fff);box-shadow:none}
:is(.gbtn,.btn.on) svg{color:inherit}
:is(.anch button.on,.pivg button.on,#rcard .bar i):is(*,:hover){background:var(--sel)}
#lwait{padding:14px 12px;color:var(--muted);font-size:12px}

:root{--colw:328px}

#side .hcg{background:transparent}
